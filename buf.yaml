# yaml-language-server: $schema=https://buf.build/schemas/buf.yaml
# Buf configuration for InferaDB Protocol Buffers
# https://buf.build/docs/configuration/v2/buf-yaml

version: v2

modules:
  - path: .
    name: buf.build/inferadb/proto

breaking:
  use:
    - FILE
  ignore_unstable_packages: true

lint:
  use:
    - STANDARD
    - COMMENTS
  except:
    # We use inferadb.<domain>.v1 pattern without version suffix
    - PACKAGE_VERSION_SUFFIX
  rpc_allow_google_protobuf_empty_requests: false
  rpc_allow_google_protobuf_empty_responses: false
  enum_zero_value_suffix: _UNSPECIFIED
  service_suffix: Service
